[project]
name = "chayan"
version = "0.0.1"
requires-python = "==3.11.9"
dependencies = ["pypdf", "numpy", "ollama", "fonttools"]

[project.scripts]
dev = "src.answer.ask:main"
gate = "src.answer.gate:main"
eval = "src.evaluation.eval:main"
failures = "src.evaluation.failures:main"
train = "src.training.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
